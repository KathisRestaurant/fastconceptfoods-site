<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Concept Foods</title>
<meta name="description" content="Fast Concept Foods LLC builds focused, fast-casual restaurant concepts. The company behind Kathis.">
<meta name="theme-color" content="#1F2A2E">
<meta name="color-scheme" content="light only">
<link rel="canonical" href="https://fastconceptfoods.com/">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="logo-mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1F2A2E; --accent: #E07A2E; --paper: #F6F1E7; --muted: #5B6467; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 20px; }
  .card { max-width: 640px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .mark { width: 96px; height: 96px; }
  h1 { margin: 0; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: clamp(32px, 6vw, 52px); letter-spacing: -0.5px; line-height: 1.05; }
  h1 span { color: var(--accent); }
  .llc { font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin-top: -10px; }
  p { margin: 0; font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 520px; }
  .brands { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 8px; }
  .brands-label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .brand { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border: 2px solid var(--ink); border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 500; }
  .brand:hover { background: var(--ink); color: var(--paper); }
  footer { text-align: center; padding: 24px 16px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <div class="card">
      <img class="mark" src="logo-mark.svg" alt="Fast Concept Foods logo">
      <h1>Fast Concept <span>Foods</span></h1>
      <div class="llc">LLC</div>
      <p>We build focused, fast-casual restaurant concepts: a tight menu, made fresh, done right.</p>
      <div class="brands">
        <span class="brands-label">Our brands</span>
        <a class="brand" href="https://kathisrestaurant.com/">Kathis · American-Indian Wraps →</a>
      </div>
    </div>
  </main>
  <footer>© 2026 Fast Concept Foods LLC. All rights reserved.</footer>
</body>
</html>
